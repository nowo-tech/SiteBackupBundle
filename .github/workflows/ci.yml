name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Superseded PR runs are cancelled. Push runs (main/master) get their own group (run_id), so a main run is never
# cancelled, not even while pending: tag_when_green.sh needs a completed run on every release commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Light mode (docs/GITHUB_CI.md#light-mode-for-deps-and-docs-only-prs): one representative cell plus the cheap
  # gates. The org (or repo) Actions variable NOWO_CI_PR_MODE picks the PR mode: light = every PR light; full = every
  # PR full; auto / unset = light only when the PR touches nothing but composer.json / composer.lock (root or demo),
  # docs/**, *.md, .github/ISSUE_TEMPLATE/**, specs/** or .cursor/**. push, tags, workflow_dispatch and schedule are
  # always full. Fail-closed: any error, unknown value or empty output means full (jobs reduce only on 'light').
  changes:
    name: Change scope (light or full)
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.classify.outputs.mode }}
    steps:
      - name: Checkout code (PR merge commit and its base parent)
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Classify the change
        id: classify
        env:
          EVENT: ${{ github.event_name }}
          SWITCH: ${{ vars.NOWO_CI_PR_MODE }}
          LIGHT: '^((demo/([^/]+/)?)?composer\.(json|lock)|docs/.*|specs/.*|\.cursor/.*|\.github/ISSUE_TEMPLATE/.*|.*\.md|\.github/workflows/.*)$' # TEMP pilot measurement only: reverted before merge
        run: |
          mode=full; paths=""
          if [ "$EVENT" != pull_request ]; then
            reason="event '$EVENT' always runs full"
          else
            case "$SWITCH" in
              light) mode=light; reason="NOWO_CI_PR_MODE=light: every PR is light" ;;
              full) reason="NOWO_CI_PR_MODE=full: every PR is full" ;;
              ''|auto)
                if files=$(git diff --name-only --no-renames HEAD^1 HEAD); then
                  mode=light; reason="NOWO_CI_PR_MODE=${SWITCH:-unset} (auto): only deps/docs paths changed"
                  while IFS= read -r f; do
                    [ -n "$f" ] || continue
                    if ! printf '%s\n' "$f" | grep -Eq "$LIGHT"; then mode=full; paths="$paths $f"; fi
                  done <<< "$files"
                  [ "$mode" = light ] || reason="NOWO_CI_PR_MODE=${SWITCH:-unset} (auto): non deps/docs paths changed:$paths"
                else
                  reason="NOWO_CI_PR_MODE=${SWITCH:-unset} (auto): git diff failed, fail-closed"
                fi ;;
              *) reason="NOWO_CI_PR_MODE='$SWITCH' is not light/auto/full, fail-closed" ;;
            esac
          fi
          echo "mode=$mode ($reason)"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          {
            echo "### CI mode: \`$mode\`"
            echo ""
            echo "$reason"
            if [ "$EVENT" = pull_request ] && [ -n "${files:-}" ]; then echo ""; echo "Changed paths:"; echo '```'; echo "$files" | head -200; echo '```'; fi
          } >> "$GITHUB_STEP_SUMMARY"

  git-hygiene:
    name: Git history (no Cursor co-author)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check for Cursor co-author trailers (REQ-GIT-001)
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          chmod +x .scripts/check-no-cursor-coauthor.sh
          # Only scan commits introduced by this push/PR (do not fail on
          # grandfathered trailers already on the default branch).
          ZERO=0000000000000000000000000000000000000000
          if [ "${EVENT_NAME}" = "pull_request" ] && [ -n "${PR_BASE_SHA}" ]; then
            RANGE="${PR_BASE_SHA}..HEAD"
          elif [ -n "${BEFORE_SHA}" ] && [ "${BEFORE_SHA}" != "${ZERO}" ]; then
            RANGE="${BEFORE_SHA}..HEAD"
          else
            # New ref / missing before: commits not on remote default branch.
            DEFAULT_BRANCH="${{ github.event.repository.default_branch }}"
            if git rev-parse --verify "origin/${DEFAULT_BRANCH}" >/dev/null 2>&1; then
              RANGE="origin/${DEFAULT_BRANCH}..HEAD"
            else
              RANGE="HEAD"
            fi
          fi
          echo "Scanning range: ${RANGE}"
          ./.scripts/check-no-cursor-coauthor.sh "${RANGE}"

  # REQ-SF-002: matrix must include mandatory Symfony minors 7.4, 8.1 (see BUNDLES_FULL_SPECS_DETAILS.md).
  test:
    name: PHP ${{ matrix.php }} - Symfony ${{ matrix.symfony }}
    runs-on: ubuntu-latest
    needs: changes
    # Never skipped at job level: a skipped matrix job reports its un-expanded name and the required contexts would never appear.
    if: ${{ !cancelled() }}

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        # Symfony 8.0 reached end of maintenance (July 2026): its CI cell is dropped (REQ-SF-002); composer.json still allows ^8.0.
        # 8.2 is 8.2.x-dev until the November 2026 stable.
        symfony: ['7.4', '8.1', '8.2']
        exclude:
          - php: '8.2'
            symfony: '8.1'
          - php: '8.3'
            symfony: '8.1'
          - php: '8.2'
            symfony: '8.2'
          - php: '8.3'
            symfony: '8.2'

    env:
      HEAVY: ${{ needs.changes.outputs.mode != 'light' || (matrix.php == '8.5' && matrix.symfony == '8.2') }}
    steps:
      - name: Light mode (deps/docs-only PR) - covered by PHP 8.5 - Symfony 8.2
        if: env.HEAVY != 'true'
        run: echo "Light mode, this cell has nothing to do."
      - name: Checkout code
        if: env.HEAVY == 'true'
        uses: actions/checkout@v7

      - name: Setup PHP
        if: env.HEAVY == 'true'
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: json, zip, sodium
          coverage: pcov
          tools: composer:v2

      - name: Install age 1.3.1 with age-plugin-batchpass (interop tests; sha256 = GitHub release digest)
        if: env.HEAVY == 'true'
        run: |
          curl -fsSL -o /tmp/age.tar.gz https://github.com/FiloSottile/age/releases/download/v1.3.1/age-v1.3.1-linux-amd64.tar.gz
          echo "bdc69c09cbdd6cf8b1f333d372a1f58247b3a33146406333e30c0f26e8f51377  /tmp/age.tar.gz" | sha256sum -c -
          tar -xzf /tmp/age.tar.gz -C /tmp
          sudo install -m 0755 /tmp/age/age /tmp/age/age-plugin-batchpass /usr/local/bin/
          age --version

      - name: Validate composer.json
        if: env.HEAVY == 'true'
        run: composer validate --strict

      - name: Get Composer cache directory
        if: env.HEAVY == 'true'
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        if: env.HEAVY == 'true'
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php-${{ matrix.php }}-symfony-${{ matrix.symfony }}-composer-${{ hashFiles('**/composer.json') }}
          restore-keys: |
            ${{ runner.os }}-php-${{ matrix.php }}-symfony-${{ matrix.symfony }}-composer-
            ${{ runner.os }}-php-${{ matrix.php }}-composer-

      # Symfony 8.1 requires php >=8.4.1; Composer treats "8.4" as 8.4.0 and rejects it.
      - name: Override platform for Symfony 8 (requires PHP 8.4.1+)
        if: env.HEAVY == 'true' && (startsWith(matrix.symfony, '8.'))
        run: composer config platform.php 8.4.1

      # Symfony 8.2 is under development (8.2.x-dev) until November 2026.
      - name: Allow Symfony 8.2 development packages
        if: env.HEAVY == 'true' && (matrix.symfony == '8.2')
        run: |
          composer config minimum-stability dev
          composer config prefer-stable true
          # symfony/event-dispatcher-contracts v3.8.0 was tagged without ListenerIntrospectionInterface, which
          # symfony/event-dispatcher 8.2.x-dev already uses ("Interface ... ListenerIntrospectionInterface not found").
          # Take the contracts from main, aliased into the ^3 range, until a release ships the interface.
          composer require --dev --no-update "symfony/event-dispatcher-contracts:dev-main as 3.8.99"

      - name: Override Composer platform PHP (composer.json pins the minimum PHP for the lock)
        if: env.HEAVY == 'true'
        run: composer config platform.php "${{ matrix.php }}.99"

      - name: Install dependencies with Symfony ${{ matrix.symfony }}
        if: env.HEAVY == 'true'
        run: |
          composer require symfony/config:^${{ matrix.symfony }} symfony/dependency-injection:^${{ matrix.symfony }} symfony/http-kernel:^${{ matrix.symfony }} symfony/http-foundation:^${{ matrix.symfony }} symfony/security-core:^${{ matrix.symfony }} --no-interaction --no-update
          composer update "symfony/*" --with-all-dependencies --no-interaction --prefer-dist --no-progress

      - name: Composer audit (Critical/High)
        if: env.HEAVY == 'true'
        run: composer audit --locked

      - name: Run tests
        if: env.HEAVY == 'true'
        env:
          SYMFONY_DEPRECATIONS_HELPER: 'max[direct]=0'
        run: composer test

      - name: Run tests with coverage (PHP 8.2 + Symfony 7.4 only)
        if: env.HEAVY == 'true' && (matrix.php == '8.2' && matrix.symfony == '7.4')
        env:
          SYMFONY_DEPRECATIONS_HELPER: 'max[direct]=0'
        run: composer test-coverage

  # REQ-SEC-004 EN-M1: the importer against the REAL Oracle mysql 8.4 and MariaDB 11.8 client binaries.
  real-mysql-clients:
    name: Real MySQL clients (EN-M1)
    runs-on: ubuntu-latest
    needs: changes
    # Light mode: skipped (a skipped non-matrix job reports its own name as skipped, accepted by branch protection).
    if: ${{ !cancelled() && needs.changes.outputs.mode != 'light' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: json, zip, sodium
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Start MySQL 8.4 and create the client wrappers
        run: |
          set -eu
          PW="ci-$(openssl rand -hex 12)"
          echo "::add-mask::$PW"
          docker run -d --name sbb-mysql -p 127.0.0.1:3306:3306 -e MYSQL_ROOT_PASSWORD="$PW" -e MYSQL_DATABASE=beacon mysql:8.4 --mysql-native-password=ON
          for i in $(seq 1 60); do docker exec -e MYSQL_PWD="$PW" sbb-mysql mysql -uroot -e "SELECT 1" >/dev/null 2>&1 && break; sleep 2; done
          docker exec -e MYSQL_PWD="$PW" sbb-mysql mysql -uroot -e "CREATE USER 'app'@'%' IDENTIFIED WITH mysql_native_password BY '$PW'; GRANT ALL ON beacon.* TO 'app'@'%'; CREATE DATABASE beacon_drill; GRANT ALL ON beacon_drill.* TO 'app'@'%';"
          SHARED="$RUNNER_TEMP/sbb-shared"
          mkdir -p "$SHARED" "$RUNNER_TEMP/bin"
          for flavour in oracle mariadb; do
            if [ "$flavour" = oracle ]; then IMAGE=mysql:8.4; BIN=mysql; else IMAGE=mariadb:11.8; BIN=mariadb; fi
            docker pull -q "$IMAGE" >/dev/null
            # One long-lived client container per flavour: a cold `docker run` per call could exceed the importer's
            # 30 s `mysql --version` probe on a busy runner (run 44087518905).
            docker run -d --name "sbb-client-$flavour" --network host --user "$(id -u):$(id -g)" -v "$SHARED:$SHARED" --entrypoint sleep "$IMAGE" infinity >/dev/null
            printf '#!/bin/sh\nexec docker exec -i -e MYSQL_PWD %s %s "$@"\n' "sbb-client-$flavour" "$BIN" > "$RUNNER_TEMP/bin/$flavour-client"
            chmod +x "$RUNNER_TEMP/bin/$flavour-client"
            "$RUNNER_TEMP/bin/$flavour-client" --version
          done
          {
            echo "SBB_REAL_DATABASE_URL=mysql://app:$PW@127.0.0.1:3306/beacon"
            echo "SBB_REAL_SHARED_DIR=$SHARED"
            echo "SBB_REAL_CLIENT_ORACLE=$RUNNER_TEMP/bin/oracle-client"
            echo "SBB_REAL_CLIENT_MARIADB=$RUNNER_TEMP/bin/mariadb-client"
          } >> "$GITHUB_ENV"

      - name: Tampered dumps must not run client commands nor switch database (EN-M1, EO-M3)
        run: vendor/bin/phpunit --no-coverage --display-skipped --fail-on-skipped tests/Integration/RealClient

      - name: Stop MySQL
        if: always()
        run: docker rm -f sbb-mysql sbb-client-oracle sbb-client-mariadb >/dev/null 2>&1 || true

  # REQ-RUNTIME-003: separate PHP processes race on a shared lock store (Symfony Lock PdoStore) on each server; only
  # one backup / restore / setup run may hold the operation lock. Sessions use a 5 s lock wait, children a hard timeout.
  lock-store-races:
    name: Databases (lock-store races)
    runs-on: ubuntu-latest
    needs: changes
    # Light mode: skipped (a skipped non-matrix job reports its own name as skipped, accepted by branch protection).
    if: ${{ !cancelled() && needs.changes.outputs.mode != 'light' }}
    timeout-minutes: 20

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: race
          MYSQL_DATABASE: race
        ports: ['127.0.0.1:3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -prace" --health-interval=5s --health-timeout=5s --health-retries=30
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: race
          MARIADB_DATABASE: race
        ports: ['127.0.0.1:3307:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=5s --health-timeout=5s --health-retries=30
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: race
          POSTGRES_DB: race
        ports: ['127.0.0.1:5432:5432']
        options: >-
          --health-cmd="pg_isready -U postgres" --health-interval=5s --health-timeout=5s --health-retries=30

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: json, zip, pdo_mysql, pdo_pgsql
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Races on the flock fallback, FlockStore and PdoStore (MySQL 8.4, MariaDB 11.4, PostgreSQL 16)
        timeout-minutes: 10
        env:
          SBB_RACE_MYSQL: 'mysql:host=127.0.0.1;port=3306;dbname=race|root|race'
          SBB_RACE_MARIADB: 'mysql:host=127.0.0.1;port=3307;dbname=race|root|race'
          SBB_RACE_PGSQL: 'pgsql:host=127.0.0.1;port=5432;dbname=race|postgres|race'
        run: vendor/bin/phpunit --no-coverage --display-skipped --fail-on-skipped tests/Integration/Concurrency

  # The demo installs the bundle from a path repository; its lock (when present) must satisfy the bundle's
  # nowo-tech requirements. No nowo-tech/transaction-* dependency, so no dependency-floor job.
  demo-lock:
    name: Demo lock
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Demo lock satisfies the bundle's nowo-tech requirements
        run: python3 .scripts/check-demo-lock.py . --only 'nowo-tech/*'

  # 1.36+ (Beacon E0 items 9-11): binlog incrementals against a real MySQL 9 server and the Oracle client tools.
  binlog-incrementals:
    name: Binlog incrementals (MySQL 9, GTID ${{ matrix.gtid }})
    runs-on: ubuntu-latest
    needs: changes
    # Never skipped at job level: a skipped matrix job reports its un-expanded name and the required contexts would never appear.
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # GTID on, default log size.
          - gtid: 'on'
            server: '--gtid-mode=ON --enforce-gtid-consistency=ON'
          # Beacon production: GTID never enabled (file + position only) and small logs, so one incremental spans
          # several binary log files.
          - gtid: 'off'
            server: '--gtid-mode=OFF --enforce-gtid-consistency=OFF --max-binlog-size=4096'

    env:
      HEAVY: ${{ needs.changes.outputs.mode != 'light' }}
    steps:
      - name: Light mode (deps/docs-only PR) - no run for this cell
        if: env.HEAVY != 'true'
        run: echo "Light mode, this cell has nothing to do."
      - name: Checkout code
        if: env.HEAVY == 'true'
        uses: actions/checkout@v7

      - name: Setup PHP
        if: env.HEAVY == 'true'
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: json, zip, sodium
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        if: env.HEAVY == 'true'
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Start MySQL 9.7 with binary logs and create the Oracle client wrappers
        if: env.HEAVY == 'true'
        run: |
          set -eu
          # Three throwaway passwords (masked): the app's account, the backup account, the restore account (PP-M4).
          PWA="ci-$(openssl rand -hex 12)"; PWB="ci-$(openssl rand -hex 12)"; PWR="ci-$(openssl rand -hex 12)"
          echo "::add-mask::$PWA"; echo "::add-mask::$PWB"; echo "::add-mask::$PWR"
          docker run -d --name sbb-mysql9 -p 127.0.0.1:3306:3306 -e MYSQL_ALLOW_EMPTY_PASSWORD=1 -e MYSQL_DATABASE=app mysql:9.7.2 \
            ${{ matrix.server }} --binlog-format=ROW --binlog-row-image=FULL
          # Over TCP: the entrypoint's init server is socket-only, the real one listens once init is done.
          for i in $(seq 1 120); do docker exec sbb-mysql9 mysql -uroot -h127.0.0.1 --protocol=TCP -e "SELECT 1" >/dev/null 2>&1 && break; sleep 2; done
          docker exec sbb-mysql9 mysql -uroot -h127.0.0.1 --protocol=TCP -e "SELECT VERSION()"
          # Least privilege (docs/USAGE.md "MySQL grants"): no SYSTEM_VARIABLES_ADMIN anywhere.
          docker exec sbb-mysql9 mysql -uroot -e "
            CREATE USER 'app'@'%' IDENTIFIED BY '$PWA'; GRANT ALL ON app.* TO 'app'@'%';
            CREATE USER 'bk'@'%' IDENTIFIED BY '$PWB'; GRANT RELOAD, REPLICATION CLIENT, REPLICATION SLAVE ON *.* TO 'bk'@'%';
            GRANT SELECT, SHOW VIEW, TRIGGER, LOCK TABLES, EVENT ON app.* TO 'bk'@'%';
            GRANT SHOW_ROUTINE ON *.* TO 'bk'@'%';
            CREATE USER 'rs'@'%' IDENTIFIED BY '$PWR'; GRANT ALL ON app.* TO 'rs'@'%';
            GRANT REPLICATION_APPLIER, SESSION_VARIABLES_ADMIN, SET_ANY_DEFINER ON *.* TO 'rs'@'%';"
          # The server image ships mysql and mysqldump but not mysqlbinlog: take it from the matching Oracle client RPM
          # (sha256 = repo.mysql.com digest) and run it in the same image (same glibc and libraries).
          curl -fsSL -o "$RUNNER_TEMP/client.rpm" https://repo.mysql.com/yum/mysql-9.7-community/el/9/x86_64/mysql-community-client-9.7.2-1.el9.x86_64.rpm
          echo "888efdbf8f63750686377e520bf2e3df2e98c1cfb5b1cb21ebc8ce65e359b0c5  $RUNNER_TEMP/client.rpm" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/rpm" "$RUNNER_TEMP/bin"
          # bsdtar from the runner when present, else from an Alpine container: the Ubuntu apt mirrors time out at times
          # (runs 44522096215, 44523653206), and this job must not depend on them.
          if command -v bsdtar >/dev/null; then
            bsdtar -xf "$RUNNER_TEMP/client.rpm" -C "$RUNNER_TEMP/rpm" ./usr/bin/mysqlbinlog
          else
            docker run --rm -v "$RUNNER_TEMP/client.rpm:/in/client.rpm:ro" -v "$RUNNER_TEMP/rpm:/out" alpine:3.22 sh -c 'apk add -q --no-cache libarchive-tools && bsdtar -xf /in/client.rpm -C /out ./usr/bin/mysqlbinlog && chown -R '"$(id -u):$(id -g)"' /out'
          fi
          test -x "$RUNNER_TEMP/rpm/usr/bin/mysqlbinlog"
          SHARED="$RUNNER_TEMP/sbb-binlog"
          mkdir -p "$SHARED"
          for tool in mysql mysqldump mysqlbinlog; do
            printf '#!/bin/sh\necho "$*" >> "%s/argv.log"\nexec docker run --rm -i --network host --user %s -e MYSQL_PWD -e TZ -v "%s:%s" -v "%s:/usr/local/bin/mysqlbinlog:ro" mysql:9.7.2 %s "$@"\n' \
              "$SHARED" "$(id -u):$(id -g)" "$SHARED" "$SHARED" "$RUNNER_TEMP/rpm/usr/bin/mysqlbinlog" "$tool" > "$RUNNER_TEMP/bin/$tool"
            chmod +x "$RUNNER_TEMP/bin/$tool"
            "$RUNNER_TEMP/bin/$tool" --version
          done
          {
            echo "SBB_BINLOG_DATABASE_URL=mysql://app:$PWA@127.0.0.1:3306/app"
            echo "SBB_BINLOG_BACKUP_URL=mysql://bk:$PWB@127.0.0.1:3306/app"
            echo "SBB_BINLOG_RESTORE_URL=mysql://rs:$PWR@127.0.0.1:3306/app"
            echo "SBB_BINLOG_ADMIN_URL=mysql://root@127.0.0.1:3306/app"
            echo "SBB_BINLOG_SHARED_DIR=$SHARED"
            echo "SBB_BINLOG_MYSQL=$RUNNER_TEMP/bin/mysql"
            echo "SBB_BINLOG_MYSQLDUMP=$RUNNER_TEMP/bin/mysqldump"
            echo "SBB_BINLOG_MYSQLBINLOG=$RUNNER_TEMP/bin/mysqlbinlog"
            echo "SBB_BINLOG_GTID=${{ matrix.gtid }}"
          } >> "$GITHUB_ENV"

      - name: Shared server, filtered and raw captures, DDL after the full, point-in-time restore, gaps
        if: env.HEAVY == 'true'
        run: vendor/bin/phpunit --no-coverage --display-skipped --fail-on-skipped tests/Integration/Binlog

      - name: Server log on failure
        if: env.HEAVY == 'true' && (failure())
        run: docker logs --tail 200 sbb-mysql9 || true

      - name: Stop MySQL
        if: env.HEAVY == 'true' && (always())
        run: docker rm -f sbb-mysql9 >/dev/null 2>&1 || true

  # 1.37+ (UT-2): the runtime DDL of the setup progress and step tables on real servers, with DBAL 3 and DBAL 4
  # (doctrine/dbal is a soft dependency: installed for this job only).
  setup-storage-databases:
    name: Setup storage DDL (MySQL 8.4, MariaDB 11.4, PostgreSQL 16, SQLite - DBAL ${{ matrix.dbal }})
    runs-on: ubuntu-latest
    needs: changes
    # Light mode: skipped (a skipped non-matrix job reports its own name as skipped, accepted by branch protection).
    if: ${{ !cancelled() && needs.changes.outputs.mode != 'light' }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        dbal: ['3', '4']

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ddl
          MYSQL_DATABASE: ddl
        ports: ['127.0.0.1:3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pddl" --health-interval=5s --health-timeout=5s --health-retries=30
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: ddl
          MARIADB_DATABASE: ddl
        ports: ['127.0.0.1:3307:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=5s --health-timeout=5s --health-retries=30
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ddl
          POSTGRES_DB: ddl
        ports: ['127.0.0.1:5432:5432']
        options: >-
          --health-cmd="pg_isready -U postgres" --health-interval=5s --health-timeout=5s --health-retries=30

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: json, zip, pdo_mysql, pdo_pgsql, pdo_sqlite
          coverage: none
          tools: composer:v2

      - name: Install dependencies with doctrine/dbal ${{ matrix.dbal }}
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          composer require --dev --no-interaction --no-progress -W "doctrine/dbal:^${{ matrix.dbal }}"
          composer show doctrine/dbal | grep -E '^versions'

      - name: Progress and step tables on real servers (save / load / reset, insert then update, concurrent first use)
        timeout-minutes: 10
        env:
          SBB_DDL_MYSQL: 'pdo-mysql://root:ddl@127.0.0.1:3306/ddl'
          SBB_DDL_MARIADB: 'pdo-mysql://root:ddl@127.0.0.1:3307/ddl'
          SBB_DDL_PGSQL: 'pdo-pgsql://postgres:ddl@127.0.0.1:5432/ddl'
        run: vendor/bin/phpunit --no-coverage --display-skipped --fail-on-skipped tests/Integration/SetupStorage

  code-style:
    name: Code Style
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2, cs2pr

      - name: Install dependencies
        run: composer update --no-interaction --prefer-dist --no-progress

      - name: Fix code style
        run: composer cs-fix

      - name: Discard dependency pins (never commit composer.json/lock from this job)
        run: |
          git checkout -- composer.json composer.lock 2>/dev/null || true

      - name: Check for changes
        id: verify-changed-files
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit changes
        if: steps.verify-changed-files.outputs.changed == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -u -- '*.php'
          if [ -z "$(git diff --cached --name-only)" ]; then
            echo "No PHP style changes to commit"
            exit 0
          fi
          git commit -m "Apply PHP CS Fixer fixes [skip ci]"
          git push

  code-style-check:
    name: Code Style Check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2, cs2pr

      - name: Install dependencies (Symfony 7.4)
        run: |
          composer require symfony/config:^7.4 symfony/dependency-injection:^7.4 symfony/http-kernel:^7.4 symfony/http-foundation:^7.4 symfony/security-core:^7.4 --no-interaction --no-update
          composer update "symfony/*" --with-all-dependencies --no-interaction --prefer-dist --no-progress

      - name: Check code style
        run: composer cs-check

  phpstan:
    name: PHPStan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2, cs2pr

      - name: Install dependencies (Symfony 7.4)
        run: |
          composer require symfony/config:^7.4 symfony/dependency-injection:^7.4 symfony/http-kernel:^7.4 symfony/http-foundation:^7.4 symfony/security-core:^7.4 --no-interaction --no-update
          composer update "symfony/*" --with-all-dependencies --no-interaction --prefer-dist --no-progress

      - name: PHPStan (level and ignoreErrors from phpstan.neon.dist; fails the build on any error)
        run: composer phpstan --no-interaction

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    needs: changes
    # Light mode: skipped (a skipped non-matrix job reports its own name as skipped, accepted by branch protection).
    if: ${{ !cancelled() && needs.changes.outputs.mode != 'light' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: json, zip, sodium
          coverage: pcov
          tools: composer:v2

      - name: Install age 1.3.1 with age-plugin-batchpass (interop tests; sha256 = GitHub release digest)
        run: |
          curl -fsSL -o /tmp/age.tar.gz https://github.com/FiloSottile/age/releases/download/v1.3.1/age-v1.3.1-linux-amd64.tar.gz
          echo "bdc69c09cbdd6cf8b1f333d372a1f58247b3a33146406333e30c0f26e8f51377  /tmp/age.tar.gz" | sha256sum -c -
          tar -xzf /tmp/age.tar.gz -C /tmp
          sudo install -m 0755 /tmp/age/age /tmp/age/age-plugin-batchpass /usr/local/bin/
          age --version

      - name: Install bsdtar (EO-L2 tar listing test)
        run: |
          command -v bsdtar || { sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends libarchive-tools; }
          bsdtar --version

      - name: Install dependencies (Symfony 7.4)
        run: |
          composer require symfony/config:^7.4 symfony/dependency-injection:^7.4 symfony/http-kernel:^7.4 symfony/http-foundation:^7.4 symfony/security-core:^7.4 --no-interaction --no-update
          composer update "symfony/*" --with-all-dependencies --no-interaction --prefer-dist --no-progress

      - name: Run tests with coverage
        run: composer test-coverage

      - name: Validate coverage file
        run: |
          if [ ! -f coverage.xml ]; then
            echo "ERROR: coverage.xml was not generated"
            exit 1
          fi
          echo "coverage.xml generated"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: coverage.xml
          fail_ci_if_error: false

  igor:
    name: Igor (FrankenPHP worker audit)
    runs-on: ubuntu-latest
    needs: changes
    # Light mode: skipped (a skipped non-matrix job reports its own name as skipped, accepted by branch protection).
    if: ${{ !cancelled() && needs.changes.outputs.mode != 'light' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Igor worker-state audit (REQ-CS-008)
        run: composer igor
