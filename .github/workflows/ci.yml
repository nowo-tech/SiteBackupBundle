name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  git-hygiene:
    name: Git history (no Cursor co-author)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check for Cursor co-author trailers (REQ-GIT-001)
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          chmod +x .scripts/check-no-cursor-coauthor.sh
          # Only scan commits introduced by this push/PR (do not fail on
          # grandfathered trailers already on the default branch).
          ZERO=0000000000000000000000000000000000000000
          if [ "${EVENT_NAME}" = "pull_request" ] && [ -n "${PR_BASE_SHA}" ]; then
            RANGE="${PR_BASE_SHA}..HEAD"
          elif [ -n "${BEFORE_SHA}" ] && [ "${BEFORE_SHA}" != "${ZERO}" ]; then
            RANGE="${BEFORE_SHA}..HEAD"
          else
            # New ref / missing before: commits not on remote default branch.
            DEFAULT_BRANCH="${{ github.event.repository.default_branch }}"
            if git rev-parse --verify "origin/${DEFAULT_BRANCH}" >/dev/null 2>&1; then
              RANGE="origin/${DEFAULT_BRANCH}..HEAD"
            else
              RANGE="HEAD"
            fi
          fi
          echo "Scanning range: ${RANGE}"
          ./.scripts/check-no-cursor-coauthor.sh "${RANGE}"

  # REQ-SF-002: matrix must include mandatory Symfony minors 7.4, 8.1 (see BUNDLES_FULL_SPECS_DETAILS.md).
  test:
    name: PHP ${{ matrix.php }} - Symfony ${{ matrix.symfony }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        # Symfony 8.0 reached end of maintenance (July 2026): its CI cell is dropped (REQ-SF-002); composer.json still allows ^8.0.
        # 8.2 is 8.2.x-dev until the November 2026 stable.
        symfony: ['7.4', '8.1', '8.2']
        exclude:
          - php: '8.2'
            symfony: '8.1'
          - php: '8.3'
            symfony: '8.1'
          - php: '8.2'
            symfony: '8.2'
          - php: '8.3'
            symfony: '8.2'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: json, zip, sodium
          coverage: pcov
          tools: composer:v2

      - name: Install age 1.3.1 with age-plugin-batchpass (interop tests; sha256 = GitHub release digest)
        run: |
          curl -fsSL -o /tmp/age.tar.gz https://github.com/FiloSottile/age/releases/download/v1.3.1/age-v1.3.1-linux-amd64.tar.gz
          echo "bdc69c09cbdd6cf8b1f333d372a1f58247b3a33146406333e30c0f26e8f51377  /tmp/age.tar.gz" | sha256sum -c -
          tar -xzf /tmp/age.tar.gz -C /tmp
          sudo install -m 0755 /tmp/age/age /tmp/age/age-plugin-batchpass /usr/local/bin/
          age --version

      - name: Validate composer.json
        run: composer validate --strict

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php-${{ matrix.php }}-symfony-${{ matrix.symfony }}-composer-${{ hashFiles('**/composer.json') }}
          restore-keys: |
            ${{ runner.os }}-php-${{ matrix.php }}-symfony-${{ matrix.symfony }}-composer-
            ${{ runner.os }}-php-${{ matrix.php }}-composer-

      # Symfony 8.1 requires php >=8.4.1; Composer treats "8.4" as 8.4.0 and rejects it.
      - name: Override platform for Symfony 8 (requires PHP 8.4.1+)
        if: startsWith(matrix.symfony, '8.')
        run: composer config platform.php 8.4.1

      # Symfony 8.2 is under development (8.2.x-dev) until November 2026.
      - name: Allow Symfony 8.2 development packages
        if: matrix.symfony == '8.2'
        run: |
          composer config minimum-stability dev
          composer config prefer-stable true
          # symfony/event-dispatcher-contracts v3.8.0 was tagged without ListenerIntrospectionInterface, which
          # symfony/event-dispatcher 8.2.x-dev already uses ("Interface ... ListenerIntrospectionInterface not found").
          # Take the contracts from main, aliased into the ^3 range, until a release ships the interface.
          composer require --dev --no-update "symfony/event-dispatcher-contracts:dev-main as 3.8.99"

      - name: Override Composer platform PHP (composer.json pins the minimum PHP for the lock)
        run: composer config platform.php "${{ matrix.php }}.99"

      - name: Install dependencies with Symfony ${{ matrix.symfony }}
        run: |
          composer require symfony/config:^${{ matrix.symfony }} symfony/dependency-injection:^${{ matrix.symfony }} symfony/http-kernel:^${{ matrix.symfony }} symfony/http-foundation:^${{ matrix.symfony }} symfony/security-core:^${{ matrix.symfony }} --no-interaction --no-update
          composer update "symfony/*" --with-all-dependencies --no-interaction --prefer-dist --no-progress

      - name: Composer audit (Critical/High)
        run: composer audit --locked

      - name: Run tests
        env:
          SYMFONY_DEPRECATIONS_HELPER: 'max[direct]=0'
        run: composer test

      - name: Run tests with coverage (PHP 8.2 + Symfony 7.4 only)
        if: matrix.php == '8.2' && matrix.symfony == '7.4'
        env:
          SYMFONY_DEPRECATIONS_HELPER: 'max[direct]=0'
        run: composer test-coverage

  # REQ-SEC-004 EN-M1: the importer against the REAL Oracle mysql 8.4 and MariaDB 11.8 client binaries.
  real-mysql-clients:
    name: Real MySQL clients (EN-M1)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: json, zip, sodium
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Start MySQL 8.4 and create the client wrappers
        run: |
          set -eu
          PW="ci-$(openssl rand -hex 12)"
          echo "::add-mask::$PW"
          docker run -d --name sbb-mysql -p 127.0.0.1:3306:3306 -e MYSQL_ROOT_PASSWORD="$PW" -e MYSQL_DATABASE=beacon mysql:8.4 --mysql-native-password=ON
          for i in $(seq 1 60); do docker exec -e MYSQL_PWD="$PW" sbb-mysql mysql -uroot -e "SELECT 1" >/dev/null 2>&1 && break; sleep 2; done
          docker exec -e MYSQL_PWD="$PW" sbb-mysql mysql -uroot -e "CREATE USER 'app'@'%' IDENTIFIED WITH mysql_native_password BY '$PW'; GRANT ALL ON beacon.* TO 'app'@'%'; CREATE DATABASE beacon_drill; GRANT ALL ON beacon_drill.* TO 'app'@'%';"
          SHARED="$RUNNER_TEMP/sbb-shared"
          mkdir -p "$SHARED" "$RUNNER_TEMP/bin"
          for flavour in oracle mariadb; do
            if [ "$flavour" = oracle ]; then IMAGE=mysql:8.4; BIN=mysql; else IMAGE=mariadb:11.8; BIN=mariadb; fi
            docker pull -q "$IMAGE" >/dev/null
            printf '#!/bin/sh\nexec docker run --rm -i --network host --user %s -e MYSQL_PWD -v "%s:%s" %s %s "$@"\n' "$(id -u):$(id -g)" "$SHARED" "$SHARED" "$IMAGE" "$BIN" > "$RUNNER_TEMP/bin/$flavour-client"
            chmod +x "$RUNNER_TEMP/bin/$flavour-client"
            "$RUNNER_TEMP/bin/$flavour-client" --version
          done
          {
            echo "SBB_REAL_DATABASE_URL=mysql://app:$PW@127.0.0.1:3306/beacon"
            echo "SBB_REAL_SHARED_DIR=$SHARED"
            echo "SBB_REAL_CLIENT_ORACLE=$RUNNER_TEMP/bin/oracle-client"
            echo "SBB_REAL_CLIENT_MARIADB=$RUNNER_TEMP/bin/mariadb-client"
          } >> "$GITHUB_ENV"

      - name: Tampered dumps must not run client commands nor switch database (EN-M1, EO-M3)
        run: vendor/bin/phpunit --no-coverage --display-skipped --fail-on-skipped tests/Integration/RealClient

      - name: Stop MySQL
        if: always()
        run: docker rm -f sbb-mysql >/dev/null 2>&1 || true

  # 1.36+ (Beacon E0 items 9-11): binlog incrementals against a real MySQL 9 server and the Oracle client tools.
  binlog-incrementals:
    name: Binlog incrementals (MySQL 9)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: json, zip, sodium
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Start MySQL 9.7 with binary logs and create the Oracle client wrappers
        run: |
          set -eu
          command -v bsdtar || { sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends libarchive-tools; }
          # Three throwaway passwords (masked): the app's account, the backup account, the restore account (PP-M4).
          PWA="ci-$(openssl rand -hex 12)"; PWB="ci-$(openssl rand -hex 12)"; PWR="ci-$(openssl rand -hex 12)"
          echo "::add-mask::$PWA"; echo "::add-mask::$PWB"; echo "::add-mask::$PWR"
          docker run -d --name sbb-mysql9 -p 127.0.0.1:3306:3306 -e MYSQL_ALLOW_EMPTY_PASSWORD=1 -e MYSQL_DATABASE=app mysql:9.7.2 \
            --gtid-mode=ON --enforce-gtid-consistency=ON --binlog-format=ROW --binlog-row-image=FULL
          # Over TCP: the entrypoint's init server is socket-only, the real one listens once init is done.
          for i in $(seq 1 120); do docker exec sbb-mysql9 mysql -uroot -h127.0.0.1 --protocol=TCP -e "SELECT 1" >/dev/null 2>&1 && break; sleep 2; done
          docker exec sbb-mysql9 mysql -uroot -h127.0.0.1 --protocol=TCP -e "SELECT VERSION()"
          # Least privilege (docs/USAGE.md "MySQL grants"): no SYSTEM_VARIABLES_ADMIN anywhere.
          docker exec sbb-mysql9 mysql -uroot -e "
            CREATE USER 'app'@'%' IDENTIFIED BY '$PWA'; GRANT ALL ON app.* TO 'app'@'%';
            CREATE USER 'bk'@'%' IDENTIFIED BY '$PWB'; GRANT RELOAD, REPLICATION CLIENT, REPLICATION SLAVE ON *.* TO 'bk'@'%';
            GRANT SELECT, SHOW VIEW, TRIGGER, LOCK TABLES, EVENT ON app.* TO 'bk'@'%';
            GRANT SHOW_ROUTINE ON *.* TO 'bk'@'%';
            CREATE USER 'rs'@'%' IDENTIFIED BY '$PWR'; GRANT ALL ON app.* TO 'rs'@'%';
            GRANT REPLICATION_APPLIER, SESSION_VARIABLES_ADMIN, SET_ANY_DEFINER ON *.* TO 'rs'@'%';"
          # The server image ships mysql and mysqldump but not mysqlbinlog: take it from the matching Oracle client RPM
          # (sha256 = repo.mysql.com digest) and run it in the same image (same glibc and libraries).
          curl -fsSL -o "$RUNNER_TEMP/client.rpm" https://repo.mysql.com/yum/mysql-9.7-community/el/9/x86_64/mysql-community-client-9.7.2-1.el9.x86_64.rpm
          echo "888efdbf8f63750686377e520bf2e3df2e98c1cfb5b1cb21ebc8ce65e359b0c5  $RUNNER_TEMP/client.rpm" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/rpm" "$RUNNER_TEMP/bin"
          bsdtar -xf "$RUNNER_TEMP/client.rpm" -C "$RUNNER_TEMP/rpm" ./usr/bin/mysqlbinlog
          SHARED="$RUNNER_TEMP/sbb-binlog"
          mkdir -p "$SHARED"
          for tool in mysql mysqldump mysqlbinlog; do
            printf '#!/bin/sh\necho "$*" >> "%s/argv.log"\nexec docker run --rm -i --network host --user %s -e MYSQL_PWD -e TZ -v "%s:%s" -v "%s:/usr/local/bin/mysqlbinlog:ro" mysql:9.7.2 %s "$@"\n' \
              "$SHARED" "$(id -u):$(id -g)" "$SHARED" "$SHARED" "$RUNNER_TEMP/rpm/usr/bin/mysqlbinlog" "$tool" > "$RUNNER_TEMP/bin/$tool"
            chmod +x "$RUNNER_TEMP/bin/$tool"
            "$RUNNER_TEMP/bin/$tool" --version
          done
          {
            echo "SBB_BINLOG_DATABASE_URL=mysql://app:$PWA@127.0.0.1:3306/app"
            echo "SBB_BINLOG_BACKUP_URL=mysql://bk:$PWB@127.0.0.1:3306/app"
            echo "SBB_BINLOG_RESTORE_URL=mysql://rs:$PWR@127.0.0.1:3306/app"
            echo "SBB_BINLOG_ADMIN_URL=mysql://root@127.0.0.1:3306/app"
            echo "SBB_BINLOG_SHARED_DIR=$SHARED"
            echo "SBB_BINLOG_MYSQL=$RUNNER_TEMP/bin/mysql"
            echo "SBB_BINLOG_MYSQLDUMP=$RUNNER_TEMP/bin/mysqldump"
            echo "SBB_BINLOG_MYSQLBINLOG=$RUNNER_TEMP/bin/mysqlbinlog"
          } >> "$GITHUB_ENV"

      - name: Shared server, filtered and raw captures, DDL after the full, point-in-time restore, gaps
        run: vendor/bin/phpunit --no-coverage --display-skipped --fail-on-skipped tests/Integration/Binlog

      - name: Server log on failure
        if: failure()
        run: docker logs --tail 200 sbb-mysql9 || true

      - name: Stop MySQL
        if: always()
        run: docker rm -f sbb-mysql9 >/dev/null 2>&1 || true

  code-style:
    name: Code Style
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2, cs2pr

      - name: Install dependencies
        run: composer update --no-interaction --prefer-dist --no-progress

      - name: Fix code style
        run: composer cs-fix

      - name: Discard dependency pins (never commit composer.json/lock from this job)
        run: |
          git checkout -- composer.json composer.lock 2>/dev/null || true

      - name: Check for changes
        id: verify-changed-files
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit changes
        if: steps.verify-changed-files.outputs.changed == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -u -- '*.php'
          if [ -z "$(git diff --cached --name-only)" ]; then
            echo "No PHP style changes to commit"
            exit 0
          fi
          git commit -m "Apply PHP CS Fixer fixes [skip ci]"
          git push

  code-style-check:
    name: Code Style Check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2, cs2pr

      - name: Install dependencies (Symfony 7.4)
        run: |
          composer require symfony/config:^7.4 symfony/dependency-injection:^7.4 symfony/http-kernel:^7.4 symfony/http-foundation:^7.4 symfony/security-core:^7.4 --no-interaction --no-update
          composer update "symfony/*" --with-all-dependencies --no-interaction --prefer-dist --no-progress

      - name: Check code style
        run: composer cs-check

  phpstan:
    name: PHPStan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2, cs2pr

      - name: Install dependencies (Symfony 7.4)
        run: |
          composer require symfony/config:^7.4 symfony/dependency-injection:^7.4 symfony/http-kernel:^7.4 symfony/http-foundation:^7.4 symfony/security-core:^7.4 --no-interaction --no-update
          composer update "symfony/*" --with-all-dependencies --no-interaction --prefer-dist --no-progress

      - name: PHPStan (level and ignoreErrors from phpstan.neon.dist; fails the build on any error)
        run: composer phpstan --no-interaction

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: json, zip, sodium
          coverage: pcov
          tools: composer:v2

      - name: Install age 1.3.1 with age-plugin-batchpass (interop tests; sha256 = GitHub release digest)
        run: |
          curl -fsSL -o /tmp/age.tar.gz https://github.com/FiloSottile/age/releases/download/v1.3.1/age-v1.3.1-linux-amd64.tar.gz
          echo "bdc69c09cbdd6cf8b1f333d372a1f58247b3a33146406333e30c0f26e8f51377  /tmp/age.tar.gz" | sha256sum -c -
          tar -xzf /tmp/age.tar.gz -C /tmp
          sudo install -m 0755 /tmp/age/age /tmp/age/age-plugin-batchpass /usr/local/bin/
          age --version

      - name: Install bsdtar (EO-L2 tar listing test)
        run: |
          command -v bsdtar || { sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends libarchive-tools; }
          bsdtar --version

      - name: Install dependencies (Symfony 7.4)
        run: |
          composer require symfony/config:^7.4 symfony/dependency-injection:^7.4 symfony/http-kernel:^7.4 symfony/http-foundation:^7.4 symfony/security-core:^7.4 --no-interaction --no-update
          composer update "symfony/*" --with-all-dependencies --no-interaction --prefer-dist --no-progress

      - name: Run tests with coverage
        run: composer test-coverage

      - name: Validate coverage file
        run: |
          if [ ! -f coverage.xml ]; then
            echo "ERROR: coverage.xml was not generated"
            exit 1
          fi
          echo "coverage.xml generated"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: coverage.xml
          fail_ci_if_error: false

  igor:
    name: Igor (FrankenPHP worker audit)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Igor worker-state audit (REQ-CS-008)
        run: composer igor
