services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'
        exclude:
            - '../src/Kernel.php'

    App\Setup\DemoForceSetupNeedDetector:
        arguments:
            $projectDir: '%kernel.project_dir%'

    App\Setup\DemoSeedTabChecker:
        arguments:
            $projectDir: '%kernel.project_dir%'
