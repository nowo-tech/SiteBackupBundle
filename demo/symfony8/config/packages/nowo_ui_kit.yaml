# UiKit page contract (REQ-UI-003) and REQ-DEMO-014: UiKit's default theme, unchanged (no CSS framework, no CDN, no
# token override). The Site Backup panel uses the admin layout, the panel sign-in and the setup wizard the guest layout.
nowo_ui_kit:
    css_framework: custom
    icon_set: none
    row_actions_display: text
    layouts:
        admin: 'base.html.twig'
        guest: 'layouts/guest.html.twig'
